[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "h3ltx"
version = "0.1.0"
description = "Durable API runtime for MiniMax H3 and LTX 2.5 on Runpod"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "websockets>=15,<18", "pydantic-settings>=2.8,<3", "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2", "filelock>=3,<5", "typer>=0.16,<1", "rich>=14,<16",
  "huggingface-hub[hf_xet]>=0.34,<3", "nvidia-ml-py>=13,<14", "psutil>=7,<8",
]

[project.optional-dependencies]
serverless = ["runpod>=1.7,<2"]

[dependency-groups]
dev = ["ruff>=0.15,<1", "mypy>=1.19,<3", "types-PyYAML", "types-psutil", "pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8"]

[project.scripts]
h3ltx = "h3ltx.cli:app"
h3ltx-client = "h3ltx.client:app"

[tool.hatch.build.targets.wheel]
packages = ["src/h3ltx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/h3ltx"]
[[tool.mypy.overrides]]
module = ["pynvml", "runpod", "ltx_core.*", "ltx_pipelines.*", "torch", "nodes", "comfy.*", "comfy_api.*", "aiohttp", "server"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=h3ltx --cov-report=term-missing"

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "models", "docker", "runpod", "tests", "examples", "scripts", ".github", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", ".gitignore", ".dockerignore", ".env.example", ".python-version"]
